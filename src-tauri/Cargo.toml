[package]
name = "rexpaper"
version = "1.0.6"
edition = "2024"
description = "A fast, native wallpaper manager for Windows with mpv live wallpapers"
license = "GPL-3.0"
repository = "https://github.com/rexxpaper/rexpaper"
publish = false

[dependencies]
rexpaper-core = { path = "../crates/rexpaper-core" }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
rfd = "0.15"
rand = "0.9"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
